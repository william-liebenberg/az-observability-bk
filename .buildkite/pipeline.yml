env:
  AZURE_TENANT_ID: "096aab35-433f-420f-83de-602352e62125"
  
  APP_NAME: "azobservability-funcapp"
  DEV_FUNCTION_APP_NAME: "coffeeobs-func-45hsfjth6qdyi"
  DEV_RESOURCE_GROUP: "rg-coffee-observability"
  DEV_SMOKE_URL: "https://coffeeobs-func-45hsfjth6qdyi.azurewebsites.net/api/health"
  DEV_AZURE_CLIENT_ID: "8d642690-6ec7-46a9-b2e2-491534513d78"
  DEV_AZURE_SUBSCRIPTION_ID: "43b7a2aa-b2f7-408e-a4ad-26dd069437df"
  DEV_DEPLOY_QUEUE: "my-super-secret-buildkite-agent-queue"
  PROD_FUNCTION_APP_NAME: "coffeeobs-func-45hsfjth6qdyi"
  PROD_RESOURCE_GROUP: "rg-coffee-observability"
  PROD_SMOKE_URL: "https://coffeeobs-func-45hsfjth6qdyi.azurewebsites.net/api/health"
  PROD_AZURE_CLIENT_ID: "8d642690-6ec7-46a9-b2e2-491534513d78"
  PROD_AZURE_SUBSCRIPTION_ID: "43b7a2aa-b2f7-408e-a4ad-26dd069437df"
  PROD_DEPLOY_QUEUE: "my-super-secret-buildkite-agent-queue"

agents:
    queue: "${DEV_DEPLOY_QUEUE}"

steps:

  - label: ":package: Package Function App"
    key: "package"
    command: "bash ops/scripts/package-function.sh"
    artifact_paths:
      - "artifacts/*.zip"
      - "artifacts/*.zip.sha256"
      - "artifacts/*.zip.manifest"

  - label: ":azure: Deploy dev"
    key: "deploy-dev"
    branches: "main"
    depends_on: "package"
    env:
      ARM_CLIENT_ID: ${DEV_AZURE_CLIENT_ID}
      ARM_TENANT_ID: ${AZURE_TENANT_ID}
      ARM_SUBSCRIPTION_ID: ${DEV_AZURE_SUBSCRIPTION_ID}
    command: |      
      echo "Installing Azure CLI..."
      bash ops/scripts/install-az.sh

      echo 'Obtaining Azure OIDC token...'
      export BUILDKITE_OIDC_TOKEN=$(buildkite-agent oidc request-token --audience "api://AzureADTokenExchange")
      echo "The OIDC token is: $BUILDKITE_OIDC_TOKEN"

      echo "Logging in to Azure tenant ${AZURE_TENANT_ID} / ${DEV_AZURE_CLIENT_ID} with OIDC token ${BUILDKITE_OIDC_TOKEN}"
      echo "Logging in to Azure tenant $$ARM_TENANT_ID / $$ARM_CLIENT_ID with OIDC token $$BUILDKITE_OIDC_TOKEN"

      az login --service-principal --username "$$ARM_CLIENT_ID" --tenant "$$ARM_TENANT_ID" --federated-token "$$BUILDKITE_OIDC_TOKEN"
      
      echo "Setting Azure subscription to $$ARM_SUBSCRIPTION_ID"
      az account set -s "$$ARM_SUBSCRIPTION_ID"

      echo "Deploying Function App to dev environment..."
      bash ops/scripts/deploy-function.sh dev
    
  - label: ":test_tube: Smoke test dev"
    key: "smoke-dev"
    branches: "main"
    depends_on: "deploy-dev"
    command: "bash ops/scripts/smoke-test.sh \"${DEV_SMOKE_URL}\""




  - block: ":rocket: Deploy to prod"
    key: "approve-prod"
    branches: "main"
    depends_on: "smoke-dev"

  - label: ":azure: Deploy prod"
    key: "deploy-prod"
    branches: "main"
    depends_on: "approve-prod"
    command: |
      bash ops/scripts/install-az.sh
      az login --service-principal --username "$PROD_AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" --federated-token "$BUILDKITE_OIDC_TOKEN"
      az account set -s "$PROD_AZURE_SUBSCRIPTION_ID"
      bash ops/scripts/deploy-function.sh prod

  - label: ":test_tube: Smoke test prod"
    key: "smoke-prod"
    branches: "main"
    depends_on: "deploy-prod"
    command: "bash ops/scripts/smoke-test.sh \"${PROD_SMOKE_URL}\""

